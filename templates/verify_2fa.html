<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vérification | ProFin-AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f4f7f6; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .auth-card { background: white; padding: 40px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; max-width: 400px; }
        .otp-input { font-size: 2rem; letter-spacing: 10px; text-align: center; font-weight: bold; border: 2px solid #3498db; }
    </style>
</head>
<body>
    <div class="auth-card shadow-lg">
        <div class="mb-4">
            <i class="fas fa-envelope-open-text fa-3x text-primary"></i>
        </div>
        <h4 class="fw-bold">Vérification par Email</h4>
        <p class="text-muted small">Nous avons envoyé un code à 6 chiffres à votre adresse email.</p>
        
        <form action="{{ url_for('verify_2fa') }}" method="POST">
            <div class="mb-4 mt-4">
                <input type="text" name="otp" class="form-control otp-input" maxlength="6" placeholder="000000" required autofocus>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-3 fw-bold">Vérifier le code</button>
        </form>
        <div class="mt-4">
            <a href="{{ url_for('login') }}" class="text-muted small text-decoration-none">Retour à la connexion</a>
        </div>
    </div>
</body>
</html>
