<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription | ProFin-AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #2c3e50 0%, #3498db 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: 'Segoe UI', sans-serif; }
        .auth-card { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.2); width: 100%; max-width: 450px; }
        .btn-primary { background: #3498db; border: none; padding: 12px; border-radius: 10px; font-weight: bold; }
        .btn-primary:hover { background: #2980b9; }
        .form-control { border-radius: 10px; padding: 12px; background: #f8f9fa; }
    </style>
</head>
<body>
    <div class="auth-card">
        <h2 class="text-center fw-bold mb-2">ProFin-AI</h2>
        <p class="text-center text-muted mb-4">Créez votre compte entrepreneur</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="alert alert-{{ category }} small">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form action="{{ url_for('register') }}" method="POST">
            <div class="mb-3">
                <label class="form-label small fw-bold">Nom complet</label>
                <input type="text" name="nom" class="form-control" placeholder="Ex: Dr Enoch Numbi" required>
            </div>
            <div class="mb-3">
                <label class="form-label small fw-bold">Adresse Email</label>
                <input type="email" name="email" class="form-control" placeholder="nom@exemple.com" required>
            </div>
            <div class="mb-3">
                <label class="form-label small fw-bold">Mot de passe</label>
                <input type="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 mt-2">S'inscrire</button>
        </form>
        <p class="text-center mt-4 small">Déjà inscrit ? <a href="{{ url_for('login') }}" class="text-decoration-none text-primary fw-bold">Connectez-vous</a></p>
    </div>
</body>
</html>
